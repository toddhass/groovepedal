  <style>
    :root {
      --bg:#11100e; --fg:#f7f4ee; --muted:#cfc9bc; --card:#1f1c18; --secondary:#2d2a24;
      --primary:#f3eee4; --primary-fg:#141210; --dim:#6f6a60;
      --fill:#3d73ff; --next:#2aad55; --restart:#f07820; --accent:#7c4aef; --pedal:#fffdf8;
      --border: 0 0 0 1px rgb(255 255 255 / .2);
      --line: rgb(255 255 255 / .22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Figtree, ui-sans-serif, system-ui, sans-serif; font-size: 17px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; overflow-x: hidden; max-width: 100%; min-height: 100dvh; }
    button:not(:disabled) { cursor: pointer; }
    .wrap { width: 100%; max-width: 28rem; margin: 0 auto; padding: 1rem 1rem 5.5rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .brand { font-size: 1.05rem; font-weight: 600; letter-spacing: -.02em; }
    .brand small { display: block; color: var(--muted); font-size: .85rem; font-weight: 400; }
    .badge { border-radius: 999px; padding: .3rem .8rem; font-size: .85rem; font-weight: 600; background: var(--secondary); color: var(--fg); box-shadow: var(--border); }
    .badge.on { background: var(--primary); color: var(--primary-fg); }
    .card { background: var(--card); border-radius: 1rem; padding: 1rem; box-shadow: var(--border); min-width: 0; }
    .kicker { margin: 0 0 .5rem; font-size: .85rem; color: var(--muted); font-weight: 600; }
    .now h2 { margin: .35rem 0 0; font-size: 1.45rem; font-weight: 600; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now .who { margin: .25rem 0 0; color: var(--muted); font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .75rem; text-align: center; margin-top: 1rem; }
    .meta dt { color: var(--muted); font-size: .8rem; font-weight: 600; } .meta dd { margin: .15rem 0 0; font-size: 1rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .steps { display: flex; gap: .5rem; margin-top: 1.15rem; }
    .beat { display: flex; flex: 1; min-width: 0; gap: .25rem; }
    .step { height: .7rem; flex: 1; border-radius: 999px; background: var(--dim); }
    .step.on { background: var(--primary); }
    .step.fill { background: var(--fill); }
    .start { min-height: 3.6rem; width: 100%; border: 0; border-radius: .75rem; background: var(--primary); color: var(--primary-fg); font: 600 1.15rem Figtree, sans-serif; }
    .start.stop { background: var(--secondary); color: var(--fg); box-shadow: var(--border); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .pedal { min-height: 3.15rem; width: 100%; border: 0; border-radius: .5rem; color: var(--pedal); font: 600 1rem Figtree, sans-serif; }
    .fill { background: var(--fill); } .next { background: var(--next); } .restart { background: var(--restart); } .crash { background: var(--accent); }
    .sliders { display: flex; flex-direction: column; gap: .5rem; }
    .sl { display: flex; align-items: center; gap: .75rem; font-size: .9rem; min-width: 0; color: var(--fg); font-weight: 600; }
    .sl span:last-child { width: 2.6rem; flex-shrink: 0; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; font-size: 1rem; }
    input[type=range] { flex: 1; min-width: 0; appearance: none; height: 2.5rem; background: linear-gradient(to right, var(--primary) 0 var(--pct,50%), var(--dim) var(--pct,50%) 100%); background-size: 100% .35rem; background-repeat: no-repeat; background-position: center; }
    input[type=range]::-webkit-slider-thumb { appearance: none; width: 1.25rem; height: 1.25rem; border-radius: 999px; background: var(--fg); }
    input[type=search] { width: 100%; height: 3rem; border: 1px solid var(--line); border-radius: .5rem; background: #141311; color: var(--fg); padding: 0 .9rem; font: 500 1rem Figtree, sans-serif; }
    input[type=search]::placeholder { color: #b7b1a4; }
    input[type=search]:focus { outline: 2px solid rgb(243 238 228 / .7); }
    .list { max-height: 14rem; overflow-y: auto; margin-top: .5rem; min-height: 0; }
    .row { width: 100%; display: flex; justify-content: space-between; gap: .75rem; text-align: left; background: transparent; border: 0; color: inherit; border-radius: .5rem; padding: .7rem .75rem; font: inherit; min-width: 0; }
    .row.active { background: rgb(243 238 228 / .14); }
    .row .t { font-weight: 600; font-size: 1rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .a, .row .bpm { color: var(--muted); font-size: .88rem; }
    .row .a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .label { color: var(--muted); font-size: .85rem; margin: 0 0 .4rem; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip { min-height: 2.6rem; border: 1px solid var(--line); border-radius: 999px; background: var(--secondary); color: var(--fg); font: 600 .9rem Figtree, sans-serif; padding: 0 .95rem; }
    .chip.on, .inst.on { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
    .inst { min-height: 2.9rem; width: 100%; border: 1px solid var(--line); border-radius: .5rem; background: var(--secondary); color: var(--fg); font: 600 .95rem Figtree, sans-serif; }
    .file-btn { display: flex; align-items: center; justify-content: center; position: relative; }
    .file-btn input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .hint { color: var(--muted); font-size: .9rem; margin: 0 0 .4rem; line-height: 1.45; }
    .track-name { color: var(--fg); font-size: 1rem; font-weight: 600; margin: .2rem 0 .35rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-bar { height: .35rem; border-radius: 999px; background: var(--secondary); overflow: hidden; margin: 0 0 .5rem; }
    .ai-fill { height: 100%; width: 0; background: var(--primary); }
    .apple-list { max-height: 10rem; overflow-y: auto; margin: 0 0 .5rem; border-radius: .5rem; background: #141311; box-shadow: var(--border); }
    .apple-row { min-height: 2.9rem; width: 100%; text-align: left; background: transparent; color: var(--fg); border: 0; border-radius: .4rem; padding: .5rem .75rem; font: inherit; }
    .apple-row .t { display: block; font-weight: 600; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .apple-row .a { display: block; color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inst[disabled] { opacity: .55; }
    .inst-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
    .band-list { max-height: 13rem; overflow-y: auto; border-radius: .5rem; background: #141311; box-shadow: var(--border); }
    .band-group { color: var(--muted); font-size: .85rem; font-weight: 600; margin: .45rem .75rem .15rem; }
    .band-row { width: 100%; display: block; text-align: left; background: transparent; border: 0; color: inherit; border-radius: .5rem; padding: .6rem .75rem; font: inherit; }
    .band-row.on { background: rgb(243 238 228 / .14); }
    .band-row .t { font-weight: 600; font-size: 1rem; display: block; }
    .band-row .a { color: var(--muted); font-size: .85rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .foot { text-align: center; color: var(--muted); font-size: .85rem; }
    .empty { padding: 1.5rem .75rem; text-align: center; color: var(--muted); font-size: 1rem; }
    .player, .library, .rail { display: none; flex-direction: column; gap: .75rem; min-width: 0; }
    .player { display: flex; }
    body.pane-songs .library { display: flex; }
    body.pane-track .rail-track { display: flex; }
    body.pane-band .rail-band { display: flex; }
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .25rem; padding: .5rem 1rem max(.75rem, env(safe-area-inset-bottom)); background: rgb(17 16 14 / .94); backdrop-filter: blur(8px); }
    .tabs button { min-height: 2.7rem; border: 1px solid transparent; border-radius: .5rem; background: transparent; color: var(--fg); font: 600 .95rem Figtree, sans-serif; }
    .tabs button.on { background: var(--card); color: var(--fg); box-shadow: var(--border); }
    @media (min-width: 1024px) {
      .wrap {
        max-width: 80rem;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(16rem, .95fr) minmax(20rem, 1.2fr) minmax(16rem, .95fr);
        grid-template-areas: "head head head" "list player tabs" "list player rail" "foot foot foot";
        gap: 1rem 1.25rem;
        padding: 1.75rem 2rem max(1.5rem, env(safe-area-inset-bottom));
        align-content: start;
      }
      header { grid-area: head; }
      .library { grid-area: list; display: flex !important; min-height: 24rem; }
      .list { max-height: none; flex: 1; }
      .player { grid-area: player; }
      .rail-track { grid-area: rail; }
      .rail-band { grid-area: rail; }
      body.pane-band .rail-track { display: none !important; }
      body:not(.pane-band) .rail-track { display: flex !important; }
      body.pane-band .rail-band { display: flex !important; }
      body:not(.pane-band) .rail-band { display: none !important; }
      .tabs { position: static; grid-area: tabs; padding: 0; background: transparent; backdrop-filter: none; grid-template-columns: 1fr 1fr; }
      .tabs [data-tab="songs"] { display: none; }
      .foot { grid-area: foot; }
    }

<body class="pane-songs">
  <div class="wrap">
    <header>
      <div class="brand">GroovePedal<small>Play along. Stay in the pocket.</small></div>
      <span class="badge" id="status">Ready</span>
    </header>
    <div class="player">
      <section class="card now">
        <p class="kicker">Now playing</p>
        <h2 id="song">—</h2>
        <p class="who" id="artist">—</p>
        <dl class="meta">
          <div><dt>Groove</dt><dd id="groove">—</dd></div>
          <div><dt>Part</dt><dd id="part">—</dd></div>
          <div><dt>Tempo</dt><dd id="tempo">—</dd></div>
        </dl>
        <div class="steps" id="dots"></div>
      </section>
      <button class="start" id="start" type="button">Start</button>
      <div class="grid">
        <button class="pedal fill" id="fill" type="button">Fill</button>
        <button class="pedal next" id="next" type="button">Next part</button>
        <button class="pedal restart" id="restart" type="button">Restart</button>
        <button class="pedal crash" id="accent" type="button">Crash</button>
      </div>
      <section class="card">
        <p class="label">Groove</p>
        <div class="chips" id="styles"></div>
        <div class="sliders" style="margin-top:1rem">
          <label class="sl">Tempo <input id="bpm" type="range" min="40" max="240" value="120" /> <span id="bpmv">120</span></label>
          <label class="sl">Volume <input id="vol" type="range" min="0" max="100" value="100" /> <span id="volv">100</span></label>
        </div>
      </section>
    </div>
    <div class="card library">
      <p class="kicker">Library</p>
      <input id="q" type="search" placeholder="Search a song" aria-label="Search songs" />
      <div id="list" class="list"></div>
    </div>
    <div class="rail rail-track card">
      <p class="kicker">Practice track</p>
      <p class="hint">Load an mp3 or m4a, or tap a 30-second Apple preview. Then hit Start.</p>
      <div class="apple-list" id="applehits"></div>
      <div class="inst-grid">
        <label class="inst file-btn">Load file<input id="trackfile" type="file" accept="audio/*,video/webm,video/mp4,.mp3,.m4a,.wav,.aac,.ogg,.webm,.mp4,.mkv" /></label>
        <button class="inst" id="findinst" type="button">Find instrumental</button>
      </div>
      <p class="track-name" id="trackname">No file loaded</p>
      <p class="hint" id="trackai"></p>
      <div class="ai-bar" id="aibarwrap" hidden><div class="ai-fill" id="aibar"></div></div>
      <button class="inst" id="retryai" type="button" hidden>AI split</button>
      <div class="inst-grid">
        <button class="inst" id="countin" type="button">Count-in</button>
        <button class="inst" id="ailock" type="button" disabled>AI lock</button>
        <button class="inst" id="trackvocals" type="button" disabled>Vocals</button>
        <button class="inst" id="trackguitar" type="button" disabled>Guitar</button>
      </div>
      <div class="inst-grid" id="nudgewrap" hidden>
        <button class="pedal restart" id="songearly" type="button">Song early</button>
        <button class="pedal next" id="songlate" type="button">Song late</button>
      </div>
    </div>
    <div class="rail rail-band card">
      <p class="kicker">Band</p>
      <div class="band-list" id="ensembles"></div>
      <div id="inst-groups"></div>
      <button class="inst" id="cowbell" type="button">Cowbell</button>
      <button class="inst" id="midi" type="button">Connect MIDI</button>
      <p class="hint" id="midihelp"></p>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="songs" class="on">Songs</button>
      <button type="button" data-tab="track">Track</button>
      <button type="button" data-tab="band">Band</button>
    </nav>
    <p class="foot">Software drum machine. Not affiliated with any hardware pedal.</p>
  </div>

  this.emit();
};
Engine.prototype.startSplit=function(){
  this.trackAi="error";
  this.trackAiMessage="AI split is off — it used too much RAM. Turn Guitar off for a quick mute.";
  this.emit();
};
Engine.prototype.begin=function(){
  if(!this.playing||!this.ctx||this.clock)return;
  if(this.ctx.state!=="running"){this.ctx.resume();return;}
  var beat=60/(this.bpm||120);
  var six=beat/4;
  var resume=this.hold; this.hold=null;
  var transport=resume?resume.clockStep*six:0;
  this.clock=true; this.arming=false;
  this.drumLag=0; this.songLag=0;
  try{ if(this.track&&this.track.setAlign) this.track.setAlign(0); }catch(e){}
  if(this.drumAlign) this.drumAlign.delayTime.value=0;
  var when=this.ctx.currentTime+0.2;
  if(this.countInOn&&!resume&&this.track&&(this.track.buffer||this.track.media)&&this.synth){
    var clickAt=when;
    when=clickAt+beat*4;
    for(var i=0;i<4;i++){
      var t=clickAt+i*beat;
      try{ this.synth.trig("kick",t,i===0?1:0.5); this.synth.trig("hat",t,i===3?1:0.75); }catch(e){}
    }
  }
  if(resume){
    this.clockStep=resume.clockStep; this.partIndex=resume.partIndex; this.step=resume.step;
    this.inFill=resume.inFill; this.fillStep=resume.fillStep||0;
    this.origin=when-this.clockStep*six; this.nextT=when;
    try{ if(this.track)this.track.play(when, transport); }catch(e){}
  } else {
    this.clockStep=0; this.origin=when; this.nextT=when;
    try{ if(this.track)this.track.play(when, 0); }catch(e){}
  }
  clearInterval(this.timer);
  var self=this;
  this.timer=setInterval(function(){self.sched();},40);
  try{ this.sched(); }catch(e){}
  this.emit();
};
Engine.prototype.seekTrack=function(){
  if(!this.playing||!this.ctx||!this.track)return;
  var when=this.ctx.currentTime+.12;
  this.track.play(when, this.origin?Math.max(0, when-this.origin):0);
};
Engine.prototype.lockTrack=function(){
  this.seekTrack();
};
Engine.prototype.reattach=function(){
  if(!this.playing||!this.ctx||!this.track||!(this.track.buffer||this.track.media)||!this.clock)return;
  if(this.track.src || (this.track.media && !this.track.media.paused)) return;
  var when=this.ctx.currentTime+.08;
  this.track.play(when, Math.max(0, when-this.origin));
};
Engine.prototype.sched=function(){
  if(!this.playing||!this.ctx||this.ctx.state!=="running"){
    if(this.playing && this.ctx && this.ctx.state!=="running"){
      var now=Date.now();
      if(!this._resumeAt || now-this._resumeAt>1000){
        this._resumeAt=now;
        try{ this.ctx.resume(); }catch(e){}
      }
    }
    return;
  }
  if(this.live&&this.liveLockOn&&this.track&&(this.track.buffer||this.track.media)){
    if(this.track.setAlign) this.track.setAlign(0);
    if(this.drumAlign) this.drumAlign.delayTime.setTargetAtTime(0, this.ctx.currentTime, .04);
  }
  var guard=0;
  try{
  while(this.nextT<this.ctx.currentTime+.12 && guard<8){
    if(!isFinite(this.nextT)) break;
    this.schedStep(this.nextT);this.advance();
    guard++;
  }
  }catch(e){}
  this.emit();
};
Engine.prototype.schedStep=function(when){
  var part=this.song.parts[this.partIndex]; if(!part||!this.synth)return;
  if(when<this.ctx.currentTime-0.003) return;
  var pattern=this.inFill?part.fill:part.groove;
  var st=this.inFill?this.fillStep%16:this.step%16;
  if(this.accentQ&&st===0){this.synth.trig("crash",when,1);this.accentQ=false;}
  var voices=["kick","snare","rim","hat","openHat","pedalHat","highTom","tom","floor","crash","splash","china","ride","clap"];
  var stepIdx=this.inFill?this.fillStep:this.step;
  var openV=hit(pattern.openHat,stepIdx);
  var pedalV=hit(pattern.pedalHat,stepIdx);
  for(var i=0;i<voices.length;i++){
    var v=voices[i];
    if(v==="hat"&&(openV||pedalV))continue;
    var velo=hit(pattern[v],stepIdx);if(velo)this.synth.trig(v,when,velo);
  }
  if(this.cowbellOn&&!this.inFill){
    var cRhythm=cowbellRhythm(this.song.feel,part.id);
    var velC=hit(cRhythm,st);
    if(velC)this.synth.trig("cowbell",when,velC);
  }
  if(!this.inFill){
    var acc=AC[this.song.feel]||AC.rock;
    var ids=Object.keys(this.enabled);
    var duck=ids.length>4?.62:1;
    for(var n=0;n<ids.length;n++){
      var spec=INST_MAP[ids[n]]; if(!spec)continue;
      var rhythm=spec.layer==="bass"?acc.br:acc.tr;
      var notes=spec.layer==="bass"?acc.bn:acc.tn;
      var velo=hit(rhythm,st), freq=(notes[st]||0)*spec.oct;
      if(velo&&freq)this.synth.play(ids[n],when,velo*duck,freq);
    }
  }
  this.vis={step:st,partIndex:this.partIndex,inFill:this.inFill};
};
Engine.prototype.advance=function(){
  var part=this.song.parts[this.partIndex];
  var six=60/(this.bpm||120)/4;
  var odd=(this.inFill?this.fillStep:this.step)%2===1;
  var sw=(this.track&&(this.track.buffer||this.track.media))?0:(part&&part.swing||0);
  this.clockStep=(this.clockStep||0)+1;
  if(this.track&&(this.track.buffer||this.track.media)) this.nextT=this.origin+this.clockStep*six;
  else this.nextT+=odd?six*(1+sw*.55):six*(1-sw*.55);
  if(this.inFill){this.fillStep++; if(this.fillStep>=16){this.inFill=false; this.advancePart(); this.step=0;} return;}
  this.step++;
  if(this.fillQ && this.step%16===0){this.inFill=true;this.fillStep=0;this.fillQ=false;return;}
  if(this.nextQ){this.advancePart();this.step=0;this.nextQ=false;}
  else if(part&&this.step>=part.bars*16)this.step=0;
};
Engine.prototype.advancePart=function(){this.partIndex=(this.partIndex+1)%this.song.parts.length;};

var hits=SEEDS.slice(), selected=SEEDS[0], song=makeSong(selected), searchTimer=0;
function $(id){return document.getElementById(id);}
function renderList(){

    btn.addEventListener("pointerdown",function(){pick(btn.dataset.id);});
  });
}
function pick(id){
  if(id===selected.id)return;
  engine.stop();
  var h=hits.find(function(x){return x.id===id;})||SEEDS.find(function(x){return x.id===id;});
  if(!h)return;
  selected=h; song=makeSong(h); engine.load(song); paint(); renderList(); searchApple();
}
function paint(st){
  st=st||engine.state();
  var cur=st.playing?st.step%16:-1;
  var clockKey=cur+"|"+(st.inFill?1:0)+"|"+(st.playing?1:0)+"|"+(st.ready?1:0)+"|"+st.partName+"|"+Math.round(st.bpm*10);
  if(clockKey!==paint._clock){
    paint._clock=clockKey;
    var host=$("dots");
    if(host.childElementCount!==4){
      host.textContent="";
      for(var b=0;b<4;b++){
        var beat=document.createElement("div"); beat.className="beat";
        for(var s=0;s<4;s++){ var sp=document.createElement("span"); sp.className="step"; beat.appendChild(sp); }
        host.appendChild(beat);
      }
    }
    var steps=host.querySelectorAll(".step");
    for(var i=0;i<steps.length;i++){
      var on=i===cur;
      var cls=on?(st.inFill?"step fill":"step on"):"step";
      if(steps[i].className!==cls) steps[i].className=cls;
    }
    $("song").textContent=song.title;
    $("artist").textContent=song.artist;
    $("groove").textContent=LABELS[st.feel]||st.feel||song.feel;
    $("part").textContent=st.partName;
    $("tempo").textContent=String(Math.round(st.bpm*10)/10);
    $("status").textContent=!st.playing?"Ready":!st.ready?"Tap for sound":st.inFill?"Fill":"Playing";
    $("status").classList.toggle("on", !!(st.playing && st.ready));
    $("start").textContent=st.playing&&st.ready?"Stop":st.playing?"Tap for sound":"Start";
    $("start").classList.toggle("stop", !!st.playing);
    if(!paint._bpmDown){
      var rounded=Math.round(st.bpm);
      if(paint._bpmShown!==rounded){
        paint._bpmShown=rounded;
        $("bpm").value=rounded;
        $("bpmv").textContent=String(Math.round(st.bpm*10)/10);
        $("bpm").style.setProperty("--pct",((st.bpm-40)/200*100)+"%");
      }
    }
  }
  var panelKey=[st.feel,st.ensemble,st.cowbellOn,st.trackName,st.liveLock,st.liveLockOn,st.countInOn,st.trackVocalsOn,st.trackGuitarOn,st.trackAi,Math.round((st.trackAiProgress||0)*20),st.trackAiMessage,JSON.stringify(st.enabled)].join("|");
  if(panelKey===paint._panel) return;
  paint._panel=panelKey;
  $("styles").querySelectorAll(".chip").forEach(function(btn){btn.classList.toggle("on",btn.dataset.feel===st.feel);});
  $("ensembles").querySelectorAll(".band-row").forEach(function(btn){btn.classList.toggle("on",btn.dataset.ens===st.ensemble);});
  $("inst-groups").querySelectorAll(".inst").forEach(function(btn){btn.classList.toggle("on",!!st.enabled[btn.dataset.id]);});
  $("cowbell").classList.toggle("on",!!st.cowbellOn);
  $("trackname").textContent=st.trackName||"No file loaded";
  $("ailock").disabled=!st.trackName;
  $("ailock").classList.toggle("on",!!st.trackName&&!!st.liveLockOn);
  $("ailock").textContent=st.liveLock==="locked"?"AI lock · live":st.liveLock==="listening"?"AI lock · listen":"AI lock";
  $("countin").classList.toggle("on",!!st.countInOn);
  $("trackvocals").disabled=!st.trackName;
  $("trackguitar").disabled=!st.trackName;
  $("trackvocals").classList.toggle("on",!!st.trackName&&!!st.trackVocalsOn);
  $("trackguitar").classList.toggle("on",!!st.trackName&&!!st.trackGuitarOn);
  $("nudgewrap").hidden=!st.trackName;
  $("trackai").textContent=st.trackName?(st.trackAi==="ready"?"AI mix ready — tap Guitar off":st.trackAi==="working"?st.trackAiMessage:st.trackAi==="error"?st.trackAiMessage+". Quick mute still works.":(st.trackAiMessage||"Hit Start to play. Guitar off uses a quick mute until you AI-split.")):"";
  $("aibarwrap").hidden=!(st.trackName&&st.trackAi==="working");
  $("aibar").style.width=Math.round((st.trackAiProgress||0)*100)+"%";
  $("retryai").hidden=!(st.trackName&&st.trackAi!=="working"&&st.trackAi!=="ready");
  $("retryai").textContent=st.trackAi==="error"?"Retry AI split":"AI split";
}

function press(el,fn){
  var last=0;
  var run=function(){var n=Date.now(); if(n-last<350)return; last=n; engine.unlock(); fn();};
  el.addEventListener("pointerdown",run);
  el.addEventListener("click",run);
}

press($("next"),function(){engine.queueNext();});

press($("midi"),function(){
  engine.unlock();
  var help=$("midihelp");
  if(!navigator.requestMIDIAccess){
    $("midi").textContent="MIDI (USE CHROME OR MIDIWEB)";
    help.textContent="Safari on iPhone cannot see MIDI. Chrome/Edge on a laptop works. On iPhone open this page in MIDIWeb Browser.";
    return;
  }
  navigator.requestMIDIAccess({sysex:false}).then(function(access){
    var hook=function(input){ input.onmidimessage=function(ev){ if(ev.data) engine.handleMidi(ev.data); }; };
    access.inputs.forEach(hook);
    access.onstatechange=function(){ access.inputs.forEach(hook); };
    var names=[];
    access.inputs.forEach(function(input){ if(input.name) names.push(input.name); });
    $("midi").textContent=names[0] ? "MIDI · "+names[0] : "MIDI — NO DEVICE";
    help.textContent=names[0] ? "GM pads hit the kit. Footswitch CC64 starts/stops. CC65 fill, CC66 next." : "Plug in a USB or Bluetooth MIDI controller, then tap again.";
  }).catch(function(){
    $("midi").textContent="MIDI BLOCKED";
    help.textContent="MIDI permission was denied.";
  });
});

function searchApple(){
  var box=$("applehits");
  box.innerHTML='<p class="hint">Searching Apple catalog…</p>';
  fetch("https://itunes.apple.com/search?term="+encodeURIComponent(song.title+" "+song.artist)+"&entity=song&limit=6")
    .then(function(r){return r.json();})
    .then(function(data){
      var hits=(data.results||[]).filter(function(x){return x.previewUrl;}).slice(0,6);
      if(!hits.length){ box.innerHTML='<p class="hint">No Apple preview — load a purchased .m4a.</p>'; return; }
      box.innerHTML="";
      hits.forEach(function(h){
        var btn=document.createElement("button");
        btn.type="button";
        btn.className="apple-row";
        var t=document.createElement("span"); t.className="t"; t.textContent=h.trackName;
        var a=document.createElement("span"); a.className="a"; a.textContent=h.artistName+" · 30s preview";
        btn.appendChild(t); btn.appendChild(a);
        btn.addEventListener("click",function(){ loadApple(h.previewUrl, h.trackName+" (Apple 30s)"); });
        box.appendChild(btn);
      });
    })
    .catch(function(){ box.innerHTML='<p class="hint">Apple catalog unavailable — load a purchased file.</p>'; });
}
function loadApple(url, name){
  try{
    var host=new URL(url).hostname;
    if(host!=="audio-ssl.itunes.apple.com" && host!=="audio.itunes.apple.com") return;
  }catch(e){ return; }
  engine.unlock();
  engine.trackAi="working"; engine.trackAiProgress=0.01; engine.trackAiMessage="Loading Apple preview…"; engine.emit();
  fetch(url).then(function(r){return r.blob();}).then(function(blob){
    var file=new File([blob], name+".m4a", {type:"audio/mp4"});
    engine.loadTrack(file);
  }).catch(function(){
    engine.trackAi="error"; engine.trackAiMessage="Could not load Apple preview"; engine.emit();
  });
}

$("q").addEventListener("input",function(){
  clearTimeout(searchTimer);
  var q=$("q").value.trim();
  if(q.length<2){hits=SEEDS.slice(); renderList(); return;}
  searchTimer=setTimeout(function(){search(q);},280);
});
function search(q){
  var local=SEEDS.filter(function(s){return (s.title+" "+s.artist).toLowerCase().indexOf(q.toLowerCase())>=0;});
  hits=local.slice(); renderList();
  fetch("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&entity=song&limit=20")
    .then(function(r){return r.json();})
    .then(function(data){
      var seen={};
      local.forEach(function(s){seen[(s.title+"|"+s.artist).toLowerCase()]=1;});
      (data.results||[]).forEach(function(t){
        if(hits.length>=16)return;
        var title=(t.trackName||"").replace(/\s*\([^)]*(remaster|live|edit|version|remix)[^)]*\)/ig,"").trim()||t.trackName;
        var artist=t.artistName||"";
        if(!title||!artist)return;
        var key=(title+"|"+artist).toLowerCase();
        if(seen[key])return;
        seen[key]=1;
        hits.push({id:"it-"+t.trackId,title:title,artist:artist,bpm:0,feel:feelFromGenre(t.primaryGenreName,0)});
      });
      renderList();
    })
    .catch(function(){});
}
window.addEventListener("keydown",function(e){
  if(["INPUT","TEXTAREA"].indexOf(e.target.tagName)>=0)return;
  if(e.code==="Space"){e.preventDefault();engine.unlock();engine.toggle();}
  var k=e.key.toLowerCase();
  if(k==="f")engine.queueFill();
  if(k==="n")engine.queueNext();
  if(k==="r")engine.restart();
  if(k==="a")engine.queueAccent();
});
