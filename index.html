  <style>
    :root {
      --bg:#0c0c0b; --fg:#ece8e1; --muted:#8f8a80; --card:#161513; --secondary:#23211d;
      --primary:#e6e1d8; --primary-fg:#121110; --dim:#3a3732;
      --fill:#2d62f0; --next:#21964a; --restart:#e56a18; --accent:#6b38dc; --pedal:#f7f4ee;
      --border: 0 0 0 1px rgb(255 255 255 / .08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Figtree, ui-sans-serif, system-ui, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; overflow-x: hidden; max-width: 100%; min-height: 100dvh; }
    button:not(:disabled) { cursor: pointer; }
    .wrap { width: 100%; max-width: 28rem; margin: 0 auto; padding: 1rem 1rem 5.5rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .brand { font-size: .875rem; font-weight: 600; letter-spacing: -.02em; }
    .brand small { display: block; color: var(--muted); font-size: .75rem; font-weight: 400; }
    .badge { border-radius: 999px; padding: .25rem .75rem; font-size: .75rem; font-weight: 500; background: var(--secondary); color: var(--muted); }
    .badge.on { background: var(--primary); color: var(--primary-fg); }
    .card { background: var(--card); border-radius: 1rem; padding: 1rem; box-shadow: var(--border); min-width: 0; }
    .kicker { margin: 0 0 .5rem; font-size: .75rem; color: var(--muted); font-weight: 500; }
    .now h2 { margin: .35rem 0 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now .who { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .75rem; text-align: center; margin-top: 1rem; }
    .meta dt { color: var(--muted); font-size: .75rem; } .meta dd { margin: .15rem 0 0; font-size: .875rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .steps { display: flex; gap: .5rem; margin-top: 1.15rem; }
    .beat { display: flex; flex: 1; min-width: 0; gap: .2rem; }
    .step { height: .4rem; flex: 1; border-radius: 999px; background: var(--dim); }
    .step.on { background: var(--primary); }
    .step.fill { background: var(--fill); }
    .start { min-height: 3.5rem; width: 100%; border: 0; border-radius: .75rem; background: var(--primary); color: var(--primary-fg); font: 600 1rem Figtree, sans-serif; }
    .start.stop { background: var(--secondary); color: var(--fg); box-shadow: var(--border); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .pedal { min-height: 3rem; width: 100%; border: 0; border-radius: .5rem; color: var(--pedal); font: 600 .9rem Figtree, sans-serif; }
    .fill { background: var(--fill); } .next { background: var(--next); } .restart { background: var(--restart); } .crash { background: var(--accent); }
    .sliders { display: flex; flex-direction: column; gap: .5rem; }
    .sl { display: flex; align-items: center; gap: .75rem; font-size: .75rem; min-width: 0; color: var(--muted); }
    .sl span:last-child { width: 2rem; flex-shrink: 0; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; font-size: .875rem; }
    input[type=range] { flex: 1; min-width: 0; appearance: none; height: 2.5rem; background: linear-gradient(to right, var(--primary) 0 var(--pct,50%), var(--dim) var(--pct,50%) 100%); background-size: 100% .28rem; background-repeat: no-repeat; background-position: center; }
    input[type=range]::-webkit-slider-thumb { appearance: none; width: 1.15rem; height: 1.15rem; border-radius: 999px; background: var(--fg); }
    input[type=search] { width: 100%; height: 2.75rem; border: 0; border-radius: .5rem; background: var(--bg); color: var(--fg); padding: 0 .85rem; font: inherit; box-shadow: var(--border); }
    input[type=search]:focus { outline: 2px solid rgb(230 225 216 / .45); }
    .list { max-height: 14rem; overflow-y: auto; margin-top: .5rem; min-height: 0; }
    .row { width: 100%; display: flex; justify-content: space-between; gap: .75rem; text-align: left; background: transparent; border: 0; color: inherit; border-radius: .5rem; padding: .65rem .75rem; font: inherit; min-width: 0; }
    .row.active { background: rgb(230 225 216 / .1); }
    .row .t { font-weight: 600; font-size: .875rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .a, .row .bpm { color: var(--muted); font-size: .75rem; }
    .row .a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .label { color: var(--muted); font-size: .75rem; margin: 0 0 .4rem; font-weight: 500; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip { min-height: 2.5rem; border: 0; border-radius: 999px; background: var(--secondary); color: var(--muted); font: 500 .8rem Figtree, sans-serif; padding: 0 .9rem; }
    .chip.on, .inst.on { background: var(--primary); color: var(--primary-fg); }
    .inst { min-height: 2.75rem; width: 100%; border: 0; border-radius: .5rem; background: var(--secondary); color: var(--fg); font: 500 .8rem Figtree, sans-serif; }
    .file-btn { display: flex; align-items: center; justify-content: center; position: relative; }
    .file-btn input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .hint { color: var(--muted); font-size: .75rem; margin: 0 0 .4rem; line-height: 1.45; }
    .track-name { color: var(--fg); font-size: .875rem; margin: .2rem 0 .35rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-bar { height: .25rem; border-radius: 999px; background: var(--secondary); overflow: hidden; margin: 0 0 .5rem; }
    .ai-fill { height: 100%; width: 0; background: var(--primary); }
    .apple-list { max-height: 10rem; overflow-y: auto; margin: 0 0 .5rem; border-radius: .5rem; background: var(--bg); box-shadow: var(--border); }
    .apple-row { min-height: 2.75rem; width: 100%; text-align: left; background: transparent; color: var(--fg); border: 0; border-radius: .4rem; padding: .45rem .7rem; font: inherit; }
    .apple-row .t { display: block; font-weight: 600; font-size: .875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .apple-row .a { display: block; color: var(--muted); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inst[disabled] { opacity: .4; }
    .inst-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
    .band-list { max-height: 13rem; overflow-y: auto; border-radius: .5rem; background: var(--bg); box-shadow: var(--border); }
    .band-group { color: var(--muted); font-size: .75rem; margin: .45rem .75rem .15rem; }
    .band-row { width: 100%; display: block; text-align: left; background: transparent; border: 0; color: inherit; border-radius: .5rem; padding: .55rem .75rem; font: inherit; }
    .band-row.on { background: rgb(230 225 216 / .1); }
    .band-row .t { font-weight: 600; font-size: .875rem; display: block; }
    .band-row .a { color: var(--muted); font-size: .75rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .foot { text-align: center; color: var(--muted); font-size: .75rem; }
    .empty { padding: 1.5rem .75rem; text-align: center; color: var(--muted); font-size: .875rem; }
    .player, .library, .rail { display: none; flex-direction: column; gap: .75rem; min-width: 0; }
    .player { display: flex; }
    body.pane-songs .library { display: flex; }
    body.pane-track .rail-track { display: flex; }
    body.pane-band .rail-band { display: flex; }
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .25rem; padding: .5rem 1rem max(.75rem, env(safe-area-inset-bottom)); background: rgb(12 12 11 / .92); backdrop-filter: blur(8px); }
    .tabs button { min-height: 2.5rem; border: 0; border-radius: .5rem; background: transparent; color: var(--muted); font: 500 .875rem Figtree, sans-serif; }

        grid-template-areas: "head head head" "list player tabs" "list player rail" "foot foot foot";
        gap: 1rem 1.25rem;
        padding: 1.75rem 2rem max(1.5rem, env(safe-area-inset-bottom));
        align-content: start;

      header { grid-area: head; }
      .library { grid-area: list; display: flex !important; min-height: 24rem; }
      .list { max-height: none; flex: 1; }
      .player { grid-area: player; }
      .rail-track { grid-area: rail; }
      .rail-band { grid-area: rail; }
      body.pane-band .rail-track { display: none !important; }
      body:not(.pane-band) .rail-track { display: flex !important; }
      body.pane-band .rail-band { display: flex !important; }
      body:not(.pane-band) .rail-band { display: none !important; }
      .tabs { position: static; grid-area: tabs; padding: 0; background: transparent; backdrop-filter: none; grid-template-columns: 1fr 1fr; }
      .tabs [data-tab="songs"] { display: none; }
      .foot { grid-area: foot; }
    }

  <div class="wrap">
    <header>

      <span class="badge" id="status">Ready</span>

    <div class="player">
      <section class="card now">
        <p class="kicker">Now playing</p>
        <h2 id="song">—</h2>
        <p class="who" id="artist">—</p>
        <dl class="meta">
          <div><dt>Groove</dt><dd id="groove">—</dd></div>
          <div><dt>Part</dt><dd id="part">—</dd></div>
          <div><dt>Tempo</dt><dd id="tempo">—</dd></div>
        </dl>
        <div class="steps" id="dots"></div>
      </section>
      <button class="start" id="start" type="button">Start</button>
      <div class="grid">
        <button class="pedal fill" id="fill" type="button">Fill</button>
        <button class="pedal next" id="next" type="button">Next part</button>
        <button class="pedal restart" id="restart" type="button">Restart</button>
        <button class="pedal crash" id="accent" type="button">Crash</button>
      </div>
      <section class="card">
        <p class="label">Groove</p>
        <div class="chips" id="styles"></div>
        <div class="sliders" style="margin-top:1rem">
          <label class="sl">Tempo <input id="bpm" type="range" min="40" max="240" value="120" /> <span id="bpmv">120</span></label>
          <label class="sl">Volume <input id="vol" type="range" min="0" max="100" value="100" /> <span id="volv">100</span></label>
        </div>
      </section>
    </div>
    <div class="card library">
      <p class="kicker">Library</p>
      <input id="q" type="search" placeholder="Search a song" aria-label="Search songs" />
      <div id="list" class="list"></div>
    </div>
    <div class="rail rail-track card">
      <p class="kicker">Practice track</p>
      <p class="hint">Load an mp3 or m4a, or tap a 30-second Apple preview. Then hit Start.</p>
      <div class="apple-list" id="applehits"></div>
      <div class="inst-grid">
        <label class="inst file-btn">Load file<input id="trackfile" type="file" accept="audio/*,video/webm,video/mp4,.mp3,.m4a,.wav,.aac,.ogg,.webm,.mp4,.mkv" /></label>
        <button class="inst" id="findinst" type="button">Find instrumental</button>
      </div>
      <p class="track-name" id="trackname">No file loaded</p>
      <p class="hint" id="trackai"></p>
      <div class="ai-bar" id="aibarwrap" hidden><div class="ai-fill" id="aibar"></div></div>
      <button class="inst" id="retryai" type="button" hidden>AI split</button>
      <div class="inst-grid">
        <button class="inst" id="countin" type="button">Count-in</button>
        <button class="inst" id="ailock" type="button" disabled>AI lock</button>
        <button class="inst" id="trackvocals" type="button" disabled>Vocals</button>
        <button class="inst" id="trackguitar" type="button" disabled>Guitar</button>
      </div>
      <div class="inst-grid" id="nudgewrap" hidden>
        <button class="pedal restart" id="songearly" type="button">Song early</button>
        <button class="pedal next" id="songlate" type="button">Song late</button>
      </div>
    </div>
    <div class="rail rail-band card">
      <p class="kicker">Band</p>
      <div class="band-list" id="ensembles"></div>
      <div id="inst-groups"></div>
      <button class="inst" id="cowbell" type="button">Cowbell</button>
      <button class="inst" id="midi" type="button">Connect MIDI</button>
      <p class="hint" id="midihelp"></p>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="songs" class="on">Songs</button>
      <button type="button" data-tab="track">Track</button>
      <button type="button" data-tab="band">Band</button>
    </nav>
    <p class="foot">Software drum machine. Not affiliated with any hardware pedal.</p>
  </div>

function feelFromGenre(g,bpm){
  g=(g||"").toLowerCase();

  press(btn,function(){engine.setEnsemble(btn.dataset.ens);});
});
(function(){
  var groups=[], seen={};
  INST.forEach(function(i){ if(!seen[i.group]){seen[i.group]=[]; groups.push(i.group);} seen[i.group].push(i); });
  $("inst-groups").innerHTML=groups.map(function(g){
    return '\x3cp class="label"\x3e'+g+'\x3c/p\x3e\x3cdiv class="inst-grid"\x3e'+seen[g].map(function(i){
      return '\x3cbutton class="inst" type="button" data-id="'+i.id+'"\x3e'+i.label+'\x3c/button\x3e';
    }).join("")+'\x3c/div\x3e';
  }).join("");
  $("inst-groups").querySelectorAll(".inst").forEach(function(btn){
    press(btn,function(){engine.setInstrument(btn.dataset.id,!engine.enabled[btn.dataset.id]);});
  });
})();
paint();
document.querySelectorAll("#tabs [data-tab]").forEach(function(btn){
  btn.addEventListener("click",function(){
    var tab=btn.dataset.tab;
    document.body.classList.remove("pane-songs","pane-track","pane-band");
    document.body.classList.add("pane-"+tab);
    document.querySelectorAll("#tabs [data-tab]").forEach(function(b){ b.classList.toggle("on", b===btn); });
  });
});
$("bpm").addEventListener("pointerdown",function(){paint._bpmDown=true;engine.unlock();});
$("bpm").addEventListener("pointerup",function(){paint._bpmDown=false;});
$("bpm").addEventListener("pointercancel",function(){paint._bpmDown=false;});
$("bpm").addEventListener("input",function(e){engine.setBpm(+e.target.value);});
$("vol").addEventListener("pointerdown",function(){engine.unlock();});
$("vol").addEventListener("input",function(e){
  engine.setVol(+e.target.value/100);
  $("volv").textContent=e.target.value;
  $("vol").style.setProperty("--pct",e.target.value+"%");
});
$("vol").style.setProperty("--pct","100%");
$("q").addEventListener("input",function(){
  clearTimeout(searchTimer);
  var q=$("q").value.trim();
  if(q.length<2){hits=SEEDS.slice(); renderList(); return;}
  searchTimer=setTimeout(function(){search(q);},280);
});
function search(q){
  var local=SEEDS.filter(function(s){return (s.title+" "+s.artist).toLowerCase().indexOf(q.toLowerCase())>=0;});
  hits=local.slice(); renderList();
  fetch("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&entity=song&limit=20")
    .then(function(r){return r.json();})
    .then(function(data){
      var seen={};
      local.forEach(function(s){seen[(s.title+"|"+s.artist).toLowerCase()]=1;});
      (data.results||[]).forEach(function(t){
        if(hits.length>=16)return;
        var title=(t.trackName||"").replace(/\s*\([^)]*(remaster|live|edit|version|remix)[^)]*\)/ig,"").trim()||t.trackName;
        var artist=t.artistName||"";
        if(!title||!artist)return;
        var key=(title+"|"+artist).toLowerCase();
        if(seen[key])return;
        seen[key]=1;
        hits.push({id:"it-"+t.trackId,title:title,artist:artist,bpm:0,feel:feelFromGenre(t.primaryGenreName,0)});
      });
      renderList();
    })
    .catch(function(){});
}
window.addEventListener("keydown",function(e){
  if(["INPUT","TEXTAREA"].indexOf(e.target.tagName)>=0)return;
  if(e.code==="Space"){e.preventDefault();engine.unlock();engine.toggle();}
  var k=e.key.toLowerCase();
  if(k==="f")engine.queueFill();
  if(k==="n")engine.queueNext();
  if(k==="r")engine.restart();
  if(k==="a")engine.queueAccent();
});

</script>
</body>
</html>
