<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GroovePedal</title>
  <style>
    :root { --bg:#0c0c0b; --fg:#ece8e1; --muted:#8f8a80; --card:#161513; --gold:#d7b24a; --dim:#3a3732; --fill:#2d62f0; --next:#21964a; --restart:#e56a18; --accent:#6b38dc; --pedal:#f7f4ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Figtree, ui-sans-serif, system-ui, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; overflow-x: hidden; max-width: 100%; min-height: 100dvh; }
    button:not(:disabled) { cursor: pointer; }
    .wrap { width: 100%; max-width: 28rem; margin: 0 auto; padding: 1.25rem 1rem max(1.25rem, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
    h1 { font-family: Oswald, ui-sans-serif, system-ui, sans-serif; font-size: 1.5rem; letter-spacing: .04em; color: var(--gold); text-align: center; margin: 0; font-weight: 600; }
    .sub { text-align: center; color: var(--muted); font-size: .875rem; margin: .25rem 0 0; }
    .card { background: var(--card); border-radius: 1rem; padding: .5rem; box-shadow: 0 0 0 1px rgb(255 255 255 / .08); min-width: 0; }
    .library { display: flex; flex-direction: column; min-height: 0; }
    input[type=search] { width: 100%; height: 2.75rem; border: 0; border-radius: .75rem; background: var(--bg); color: var(--fg); padding: 0 1rem; font: inherit; box-shadow: 0 0 0 1px rgb(255 255 255 / .08); }
    input[type=search]:focus { outline: 2px solid rgb(215 178 74 / .7); }
    .list { max-height: 9rem; overflow-y: auto; margin-top: .5rem; min-height: 0; }
    .row { width: 100%; display: flex; justify-content: space-between; gap: .75rem; text-align: left; background: transparent; border: 0; color: inherit; border-radius: .5rem; padding: .65rem .75rem; font: inherit; min-width: 0; }
    .row.active { background: rgb(215 178 74 / .15); box-shadow: 0 0 0 1px var(--gold); }
    .row .t { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.active .t, .row.active .bpm { color: var(--gold); }
    .row .a, .row .bpm { color: var(--muted); font-size: .875rem; }
    .row .a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .info { padding: .75rem 1rem; }
    dl { display: grid; grid-template-columns: auto minmax(0,1fr); gap: .35rem 1rem; margin: 0; font-size: .875rem; }
    dt { color: var(--muted); } dd { margin: 0; text-align: right; color: var(--gold); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .dots { display: flex; justify-content: center; gap: 1.25rem; margin-top: 1rem; }
    .dot { width: .875rem; height: .875rem; border-radius: 999px; background: var(--dim); }
    .dot.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
    .start { min-height: 3rem; width: 100%; border: 0; border-radius: .75rem; background: #23211d; color: var(--fg); font-family: Oswald, sans-serif; font-size: 1.15rem; letter-spacing: .2em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .pedal { min-height: 3rem; width: 100%; border: 0; border-radius: .75rem; color: var(--pedal); font-family: Oswald, sans-serif; letter-spacing: .16em; font-size: .875rem; }
    .wide { grid-column: span 2; }
    .fill { background: var(--fill); } .next { background: var(--next); } .restart { background: var(--restart); } .crash { background: var(--accent); }
    .sliders { display: flex; flex-direction: column; gap: .65rem; padding: 0 .25rem; }
    .sl { display: flex; align-items: center; gap: .75rem; font-size: .875rem; min-width: 0; }
    .sl span:first-child { width: 4rem; flex-shrink: 0; color: var(--muted); }
    .sl span:last-child { width: 2.5rem; flex-shrink: 0; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
    input[type=range] { flex: 1; min-width: 0; appearance: none; height: 2.5rem; background: linear-gradient(to right, var(--gold) 0 var(--pct,50%), var(--dim) var(--pct,50%) 100%); background-size: 100% .28rem; background-repeat: no-repeat; background-position: center; }
    input[type=range]::-webkit-slider-thumb { appearance: none; width: 1.15rem; height: 1.15rem; border-radius: 999px; background: var(--fg); }
    .foot { text-align: center; color: var(--muted); font-size: .75rem; }
    .empty { padding: 1.5rem .75rem; text-align: center; color: var(--muted); font-size: .875rem; }
    .player { display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
    @media (min-width: 640px) {
      h1 { font-size: 1.85rem; }
      .list { max-height: 13rem; }
      .start, .pedal { min-height: 3.5rem; }
    }
    @media (min-width: 768px) {
      .wrap {
        max-width: 72rem;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(16rem, 1fr) minmax(20rem, 1.1fr);
        grid-template-areas: "head head" "list player" "foot foot";
        gap: 1rem 1.5rem;
        padding: 1.75rem 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        align-content: start;
      }
      header { grid-area: head; }
      .library { grid-area: list; height: 100%; }
      .list { max-height: none; flex: 1; }
      .player { grid-area: player; }
      .foot { grid-area: foot; }
      h1 { font-size: 2.15rem; }
      .sub { font-size: 1rem; }
      dl { font-size: 1rem; }
    }
    @media (min-width: 1024px) {
      .wrap { max-width: 80rem; padding: 2rem 2rem max(2rem, env(safe-area-inset-bottom)); gap: 1.25rem 2rem; }
      .dot { width: 1rem; height: 1rem; }
    }
    @media (max-width: 380px) {
      h1 { font-size: 1.3rem; }
      .list { max-height: 7.5rem; }
      .wrap { padding: 0.85rem 0.7rem max(0.85rem, env(safe-area-inset-bottom)); gap: 0.55rem; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Oswald:wght@600&display=swap" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>GroovePedal Library</h1>
      <p class="sub">Search a song, then play drums along</p>
    </header>
    <div class="card library">
      <input id="q" type="search" placeholder="Search any song... e.g. Hotel California" aria-label="Search songs" />
      <div id="list" class="list"></div>
    </div>
    <div class="player">
    <section class="card info">
      <dl>
        <dt>Song</dt><dd id="song">—</dd>
        <dt>Artist</dt><dd id="artist">—</dd>
        <dt>Groove</dt><dd id="groove">—</dd>
        <dt>Part</dt><dd id="part">—</dd>
        <dt>Tempo</dt><dd id="tempo">—</dd>
        <dt>Status</dt><dd id="status">Stopped</dd>
      </dl>
      <div class="dots" id="dots"></div>
    </section>
    <button class="start" id="start" type="button">▶ START</button>
    <div class="grid">
      <button class="pedal fill" id="fill" type="button">FILL</button>
      <button class="pedal next" id="next" type="button">NEXT PART</button>
      <button class="pedal restart wide" id="restart" type="button">RESTART</button>
      <button class="pedal crash wide" id="accent" type="button">ACCENT / CRASH</button>
    </div>
    <div class="sliders">
      <label class="sl">Tempo <input id="bpm" type="range" min="40" max="240" value="120" /> <span id="bpmv">120</span></label>
      <label class="sl">Volume <input id="vol" type="range" min="0" max="100" value="100" /> <span id="volv">100</span></label>
    </div>
    </div>
    <p class="foot">GroovePedal is a software drum machine. Not affiliated with any hardware pedal.</p>
  </div>
  <script src="data.js"></script>
  <script src="engine.js"></script>
</body>
</html>
